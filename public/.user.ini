; Batas PHP untuk unggahan foto/dokumen (dipakai PHP-FPM/CGI; diabaikan mod_php).
; Batasi sesuai aturan sementara Livewire (12 MB) agar tidak ada unggahan valid
; yang ditolak server sebelum masuk aplikasi.
upload_max_filesize = 12M
post_max_size = 13M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
